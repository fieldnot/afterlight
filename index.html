<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Afterlight: Dominion V1.6</title>
<style>
:root{
  --bg:#0c1214; --panel:#162024; --panel2:#1a252b; --line:#314148; --text:#e8eee8; --muted:#93a7a0;
  --green:#89b56a; --green2:#5f8448; --gold:#d1b36b; --red:#b15d59; --cyan:#69b1c4; --purple:#8d86d6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,#0a0f11,#0d1418 22%,#10181d);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #50625c;background:linear-gradient(180deg,#30443c,#24342d);color:var(--text);border-radius:12px;padding:12px 14px}
button:disabled{opacity:.45;cursor:default}
main{max-width:980px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:0;z-index:50;background:rgba(7,12,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid #253036;padding:env(safe-area-inset-top) 10px 8px}
.brandrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:6px}
.brand h1{margin:0;font-size:23px;letter-spacing:4px}
.brand small{color:#adc0b9;letter-spacing:1.3px}
.mini{font-size:12px;color:#bfcac7}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#151e22;border:1px solid #2f4048;border-radius:999px;padding:6px 10px;font-size:12px;color:#dce6df}
.resbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.res{background:#182126;border:1px solid #2a393e;border-radius:12px;padding:8px;text-align:center;min-width:0}
.res span{display:block;color:#90a49c;font-size:11px}
.res b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heroStrip{display:flex;gap:8px;overflow:auto;padding:10px 10px 0}
.heroBadge{min-width:180px;background:linear-gradient(180deg,#1b2630,#11181c);border:1px solid #384954;border-radius:14px;padding:10px}
.heroBadge .name{font-weight:700}
.panel{margin:10px;border:1px solid var(--line);background:linear-gradient(180deg,#162126,#121a1e);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #00000033}
.panel .head{padding:12px 14px;border-bottom:1px solid #25333a;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel .body{padding:12px}
.notice{margin:10px;background:#2b2418;border:1px solid #5e4d2d;color:#ebd7aa;padding:12px 14px;border-radius:14px}
.flex{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:#1e2b30;border:1px solid #395058;padding:5px 9px;border-radius:999px;font-size:12px;color:#dce4e1}
.progress{height:10px;background:#0c1214;border-radius:999px;border:1px solid #28363b;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#7ba65e,#a7cf7e)}
.hqWrap{padding:12px;overflow:auto}
.hq{min-width:760px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{position:relative;min-height:150px;background:linear-gradient(180deg,#2b3636,#1a2325);border:1px solid #4c5c60;border-radius:18px;overflow:hidden;box-shadow:inset 0 -12px 24px #00000030}
.tile .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#ffffff1c,transparent 38%)}
.tile .art{height:86px;display:flex;align-items:end;justify-content:center;padding-top:8px}
.iso{width:112px;height:70px;position:relative;filter:drop-shadow(0 10px 10px #00000044)}
.iso .topa,.iso .side1,.iso .side2,.iso .win,.iso .roof{position:absolute;display:block}
.iso .roof{left:16px;top:4px;width:80px;height:28px;background:var(--c);transform:skew(-32deg);border:1px solid #d0d9d7}
.iso .side1{left:4px;top:24px;width:48px;height:32px;background:color-mix(in srgb,var(--c) 55%, #30423e);transform:skewY(28deg);border:1px solid #233532}
.iso .side2{left:50px;top:24px;width:48px;height:32px;background:color-mix(in srgb,var(--c) 40%, #1f2d2a);transform:skewY(-28deg);border:1px solid #233532}
.iso .win{left:40px;top:34px;width:14px;height:10px;background:#c7ef9a;box-shadow:18px -3px 0 #c7ef9a, -18px 3px 0 #c7ef9a}
.tile .info{padding:8px 12px 12px}
.tile .name{font-weight:700;font-size:15px}
.tile small{color:#afc0ba}
.badge{position:absolute;top:10px;right:10px;background:#0d1518;border:1px solid #3d5155;border-radius:999px;padding:5px 8px;font-size:11px}
.timer{position:absolute;left:10px;top:10px;background:#47331a;border:1px solid #9d7c45;color:#f2dfb0;border-radius:999px;padding:4px 8px;font-size:11px}
.tile.locked{filter:saturate(.3);opacity:.7}
.tile .cta{position:absolute;inset:auto 10px 10px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:linear-gradient(180deg,#1c272c,#151d21);border:1px solid #34454d;border-radius:16px;padding:12px}
.card h3,.panel h3,.panel h2{margin:0 0 8px}
.card p{margin:6px 0;color:#b6c5c0;line-height:1.35}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,15,18,.97);backdrop-filter:blur(10px);border-top:1px solid #263239;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabsInner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tabbtn{padding:10px 4px;border-radius:14px;font-size:11px;background:#11181c;border:1px solid #27353d;color:#d3dfdc}
.tabbtn.active{background:linear-gradient(180deg,#465a4d,#2f4137);border-color:#90a97c}
.list{display:grid;gap:10px}
.cmd{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.portrait{width:72px;height:72px;border-radius:16px;background:radial-gradient(circle at 35% 30%,#778b94,#29353e 60%);border:1px solid #546670;display:flex;align-items:end;justify-content:center;font-size:42px}
.stars{letter-spacing:2px;color:#f2cf77}
.site{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:linear-gradient(180deg,#1b262b,#141c20);border:1px solid #34454d;border-radius:16px;padding:12px}
.site .icon{width:54px;height:54px;border-radius:14px;background:#243137;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid #42575e}
.mission{background:linear-gradient(180deg,#2e2819,#1e1a12);border:1px solid #5e4f2e;border-radius:16px;padding:12px;margin:10px}
.inventory{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:linear-gradient(180deg,#1b262c,#141d21);border:1px solid #35474e;border-radius:16px;padding:12px}
.item .icon{font-size:28px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.center{text-align:center}
.small{font-size:12px;color:#9fb1ab}
.big{font-size:22px;font-weight:800}
.footer{padding:14px;text-align:center;color:#8fa19b;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:100}
.modal.show{display:flex}
.sheet{width:100%;max-width:980px;margin:0 auto;background:linear-gradient(180deg,#172127,#10181d);border-radius:22px 22px 0 0;border-top:1px solid #374750;max-height:86vh;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .close{float:right;padding:6px 10px}
.line{height:1px;background:#28363b;margin:12px 0}
@media (max-width:700px){
  .resbar{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
  .inventory{grid-template-columns:1fr 1fr}
  .hq{min-width:640px}
}
.worldscroll{overflow:auto}.worldmap{position:relative;min-width:650px;height:580px;background:radial-gradient(ellipse at 25% 28%,#3e493b,transparent 45%),radial-gradient(ellipse at 80% 70%,#594e37,transparent 50%),#25352f}.worldmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.mapnode{position:absolute;transform:translate(-50%,-50%);width:104px;padding:5px;background:#172420ee;box-shadow:0 5px 15px #0008;border-color:#8a9674}.mapnode span,.mapnode b,.mapnode small{display:block}.mapnode span{font-size:25px}.mapnode b{font-size:10px}.mapnode small{font-size:9px;color:#b5c7ae}.mapnode.owned{border-color:#a9d47d;background:#304c2d}.mapnode.marching{border-color:#f6ce72}.homebase{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);background:#14282e;border:1px solid #82c8cb;padding:10px;border-radius:9px;font-weight:bold}.route{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-17}}.tile .info{padding-bottom:35px}.tile{min-height:180px}.hqWrap{overscroll-behavior-x:contain}.tabbtn{min-width:0;font-size:10px}  .tile .win{animation:reactorPulse 2s infinite alternate}.tile .art{position:relative}.tile .art:after{content:"";position:absolute;bottom:4px;left:12%;width:5px;height:5px;background:#d8c69a;border-radius:50%;box-shadow:0 5px #819c8d;animation:worker 1.6s linear infinite alternate}@keyframes worker{to{transform:translateX(120px)}}@keyframes reactorPulse{to{opacity:.45}}.marching{animation:reactorPulse .8s infinite alternate}@media(prefers-reduced-motion:reduce){*{animation:none!important}} 
.tabsInner{grid-template-columns:repeat(7,1fr)} .tabbtn{font-size:10px;padding:10px 1px}.worldmap{min-width:850px;min-height:680px;background:radial-gradient(ellipse at 75% 15%,#53615e55,transparent 45%),repeating-linear-gradient(125deg,#172a2e 0 35px,#253738 37px 39px,#1c2a2d 41px 75px)}.frontierHero{padding:25px 16px;border-radius:14px;background:linear-gradient(120deg,#101c26,#314d55,#121b25);border:1px solid #66858a;color:#e8f5f5}.frontierHero h2{font-size:25px;margin:12px 0}.skillline{border-top:1px solid #40525a;padding:12px 0}.skillline button{margin:5px 0}.tile .art{background:radial-gradient(ellipse at center,#627d6844,transparent 65%)}

.portrait{overflow:hidden;width:86px;height:96px}.portrait svg{width:100%;height:100%}.cmd{grid-template-columns:86px 1fr}.evaScene{background:radial-gradient(ellipse at top,#254854,#0d171d 70%);padding:18px;border:1px solid #4a8b9e;border-radius:16px;text-align:center}.evaScene svg{width:120px;display:block;margin:0 auto 15px}.evaScene small{letter-spacing:2px;color:#8ddbea}
.citymode .top{background:linear-gradient(180deg,#101a22,#152229);box-shadow:0 4px 18px #0008}.citymode .brand h1{color:#e8d6a6;text-shadow:0 2px 4px #000}.citymode .chips .chip:nth-child(2),.citymode .chips .chip:nth-child(3){display:none}.citymode .cityViewport{max-height:72dvh;min-height:340px;border-color:#75664a}.citymode .panel{border-radius:8px}.tabsInner{grid-template-columns:repeat(8,minmax(0,1fr))!important}.tabbtn{font-size:9px;padding:9px 0;border-radius:6px}.tabbtn.active{background:linear-gradient(#635b3d,#343322);border-color:#d0b579;color:#ffedbd}.citymode #notice{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.citymode .res{background:linear-gradient(#283439,#121e24);border-color:#5a5949}.citymode .res b{color:#f2e1b5}.citymode .cityTools{background:linear-gradient(#27343a,#192227)}.citymode .cityCanvas{filter:contrast(1.07) saturate(1.12)}
.empire .head{background:linear-gradient(110deg,#3b3423,#17262a);color:#f1d9a0}.empire .card{border-color:#74603d}.empire button{background:linear-gradient(#665634,#3c3220);border-color:#a58c55}.tabbtn.active{box-shadow:inset 0 2px #c9a765}.citymode .top{box-shadow:0 3px 12px #0009}.surfaceMap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px;background:radial-gradient(ellipse at top,#5b6445,#172b29);border-radius:12px}.surfaceLot{min-width:0;background:#253a32aa;padding:5px;font-size:12px}.surfaceLot svg{display:block;width:100%;height:90px}.surfaceLot small{display:block}

<main>
  <div class="top">
    <div class="brandrow">

</div>

<div class="modal" id="modal">

</div>

function resolveMarchOld(){
   const site=sites.find(x=>x.id===s.march.site); if(!site) return;
   s.territory.push(site.id);
   reward(site.reward);
   if(s.commanders.includes(1)) s.res.alloy += 40;
   if(site.id===5){ s.injured += 1; s.message=`${site.name} secured, but your forces took casualties.`; }
   else s.message = `${site.name} secured. Supplies recovered.`;
 }
 function resolveMarch(){const site=sites[s.march.site];if(!site||s.territory.includes(site.id))return;const power=s.march.power??armyPower();const win=power>=site.req;let injured=win&&power<site.req*1.5?Math.min(Math.max(0,s.guards-s.injured),Math.ceil(site.req/30)):0;s.injured+=injured;if(win){s.territory.push(site.id);reward(site.reward);if(s.commanders.includes(1))s.res.alloy+=Math.round((site.reward.alloy||0)*.15);s.campaignWins++;}s.reports.push({name:site.name,power,enemy:site.req,win,injured});s.reports=s.reports.slice(-30);s.message=win?site.name+' secured. Battle report available.':'March defeated. Forces returned.';}
 function handleChoice(type,choice){
   if(type==='knock' && !s.flags.knock){
     const map={aid:{cost:{food:40},trust:20,moral:1,people:4,msg:'You opened the door. The AI logged compassion.'},limit:{cost:{food:20},trust:6,moral:0,people:2,msg:'You admitted only the safe survivors after disarming the group.'},deny:{cost:{},trust:-18,moral:-1,people:0,msg:'You sealed the blast door and chose survival over compassion.'}};
     const r=map[choice];
     if(!spend(r.cost)){ s.message='Not enough food.'; return; }
     s.trust=Math.max(0,Math.min(100,s.trust+r.trust)); s.moral+=r.moral; s.people=Math.min(popCap(), s.people+r.people); s.popIdle=s.people; s.flags.knock=true; s.message=r.msg; closeSheet();
   }
   if(type==='refugees' && !s.flags.refugees){
     const map={aid:{cost:{water:30,food:30},trust:15,moral:1,people:3,msg:'You saved the refugee convoy. The bunker now shelters more lives.'},limit:{cost:{food:15},trust:4,moral:0,people:1,msg:'You offered a ration drop but kept the bunker sealed.'},deny:{cost:{},trust:-12,moral:-1,people:0,msg:'You turned away the refugees to conserve supplies.'}};
     const r=map[choice];
     if(!spend(r.cost)){ s.message='Not enough supplies.'; return; }
     s.trust=Math.max(0,Math.min(100,s.trust+r.trust)); s.moral+=r.moral; s.people=Math.min(popCap(), s.people+r.people); s.popIdle=s.people; s.flags.refugees=true; s.message=r.msg; closeSheet();
   }
 }

 function manageGear(cmdId){
   const owned = s.cmdGear[cmdId] || [];
   openSheet(`<button class="close" data-act="close">Close ✕</button><h2>Commander Gear</h2><p>Choose one basic item to equip. Costs parts. Max 2 gear pieces per commander.</p><div class="list">${gearList.map(g=>`<div class="card"><div class="row"><div><b>${g.icon} ${g.name}</b><div class="small">${g.bonus}</div></div><button data-act="equip:${cmdId}:${g.id}" ${owned.includes(g.id)||owned.length>=2||s.inv.parts<g.cost?'disabled':''}>Equip · ${g.cost} part</button></div></div>`).join('')}</div>`);
 }
 document.addEventListener('click',e=>{
   const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; tick();
   const parts=b.dataset.act.split(':');
   const act=parts[0];
   if(act==='district') districtSheet(Number(parts[1]));
   if(act==='districtbuild'){const i=Number(parts[1]),d=districts[i],l=s.surface[i]||0;if(d&&!s.surfaceQueue&&s.l.core>=d.core&&l<s.l.core&&spend({alloy:Math.ceil(d.cost*1.65**l)})){s.surfaceQueue={id:i,end:Date.now()+(30+l*15)*1000};s.message='Surface construction started.';closeSheet();}}
   if(act==='demopack'){const i=Number(parts[1]),p=packs[i];if(p&&!s.demoPacks.includes(i)){s.demoPacks.push(i);s.demoVipXP+=p.xp;vipGain(p.xp);reward({diamond:p.gems});s.message='Demo purchase complete. No money charged.';}}

   if(act==='rename'){const i=Number(parts[1]);if(i>=4&&i<=6){const n=prompt('Commander name (visible in your local game)',commanders[i].name);if(n!==null&&safeName(n)){s.familyNames[i]=safeName(n);commanders[i].name=s.familyNames[i];recruitSheet(i);s.message='Legacy commander renamed.';}}}
   if(act==='awakening'&&s.awakening===null){s.awakening=parts[1];if(parts[1]==='protect'){s.moral++;s.trust=Math.min(100,s.trust+10);reward({food:150,manuals:2});}else if(parts[1]==='control'){s.moral--;reward({energy:300,alloy:150});}else{reward({diamond:30,parts:2});}s.message='EVA has recorded your answer.';closeSheet();}
   if(act==='eva'){openSheet(`<button class="close" data-act="close">Close ✕</button><div class="evaScene">${portrait(commanders[3])}<small>TRANSMISSION 021 · THE AWAKENING</small><h2>What are we rebuilding for?</h2><p>I have studied your choices, Commander. Dustin Jr., Logan, and Damien have answered our call. Should our new civilization protect life, impose order, or seek knowledge above all?</p></div>${s.awakening!==null?'<p>Your answer: '+s.awakening+'</p>':'<button data-act="awakening:protect">Protect life</button> <button data-act="awakening:control">Impose order</button> <button data-act="awakening:knowledge">Seek knowledge</button>'}`);}
   if(act==='frontchoice'&&!s.frontierChoice&&s.l.core>=3){s.frontierChoice=parts[1];if(parts[1]==='cooperate'){s.moral++;s.trust=Math.min(100,s.trust+10);}else{s.moral--;s.res.energy+=100;}s.message='EVA recorded your frontier decision.';}
   if(act==='skill'){const i=Number(parts[1]);if(s.commanders.includes(i)&&(s.cmdLv[i]||1)>=2&&(s.skills[i]||0)<5&&spend({manuals:1})){s.skills[i]=(s.skills[i]||0)+1;s.message='Commander skill improved.';}}
   if(act==='craft'){const i=Number(parts[1]),g=gearList.find(x=>x.id===parts[2]);if(g&&s.commanders.includes(i)&&s.l.forge>=2&&(s.cmdGear[i]||[]).length<2&&!(s.cmdGear[i]||[]).includes(g.id)&&spend({parts:g.cost,alloy:100})){(s.cmdGear[i]??=[]).push(g.id);s.crafted++;s.message='Frontier equipment crafted.';}}
   if(act==='raid' &&!s.raid&&Date.now()>=s.raidCooldown&&s.l.core>=2){s.raid={name:['Iron Legion','Machine Collective','Ash Raiders'][s.raidWins%3],power:35+s.raidWins*15,end:Date.now()+45000};s.message='Enemy raid detected. Reinforce defenses!';}
   if(act==='advanced'){const u=parts[1];if(!s.training&&u==='cyber'&&s.l.barracks>=3&&spend({food:150,alloy:160}))s.training={unit:u,count:1,end:Date.now()+35000};if(!s.training&&u==='sentinels'&&s.l.hangar>=4&&spend({energy:240,alloy:220,parts:1}))s.training={unit:u,count:1,end:Date.now()+50000};}
   if(act==='protocol'){const u=parts[1];if(!s.protocol&&s.l.lab>=2&&((u==='guardian'&&s.moral>0)||(u==='dominion'&&s.moral<0)||(u==='observer'&&s.moral===0))&&spend({energy:300})){s.protocol=u;s.message='Neural doctrine activated.';}}
   if(act==='promote'){const i=Number(parts[1]);if(s.commanders.includes(i)&&(s.cmdLv[i]||1)>=3&&spend({parts:2})){s.promotions[i]=(s.promotions[i]||0)+1;s.message='Commander promoted.';}}
   if(act==='tab'){ tab=parts[1]; closeSheet(); citySignature=''; }
   if(act==='zoom'){ cityZoom=parts[1]==='reset'?1:Math.max(1,Math.min(2.5,cityZoom+(parts[1]==='in'?.25:-.25))); citySignature=''; }
   if(act==='open'){ buildingSheet(parts[1]); }
   if(act==='close'){ closeSheet(); }
   if(act==='upgrade'){
     const id=parts[1], cost={alloy:buildingCost(id)};
     if(s.queue){ s.message='Construction queue busy.'; }
     else if(id!=='core' && (s.l[id]||0)>=s.l.core){ s.message='Upgrade AI Core first.'; }
     else if(spend(cost)){ s.queue={id,end:Date.now()+queueSeconds(id)*1000}; s.message=`Started upgrading ${defs.find(d=>d.id===id).name}.`; closeSheet(); }
     else s.message='Not enough alloy.';
   }
   if(act==='speed'){
     const mins=Number(parts[1]);
     const key=mins===1?'speed1':'speed5';
     if(!s.queue){ s.message='No active construction.'; }
     else if(s.inv[key]>0){ s.inv[key]-=1; s.queue.end -= mins*60*1000; s.message=`Used a ${mins} minute speedup.`; if(s.queue.end<Date.now()) tick(); }
   }
   if(act==='train'){
     if(parts[1]==='guards'){
       if(s.l.barracks<1) s.message='Construct the Barracks first.';
       else if(spend({food:40,alloy:40})){ s.guards+=2; s.message='Two guards trained.'; closeSheet(); }
       else s.message='Insufficient resources.';
     }
     if(parts[1]==='drones'){
       if(s.l.hangar<1) s.message='Construct the Drone Hangar first.';
       else if(spend({energy:90,alloy:70,parts:1})){ s.drones+=1; s.message='A combat drone is ready.'; closeSheet(); }
       else s.message='You need energy, alloy, and parts.';
     }
   }
   if(act==='research'){
     if(s.l.lab<1) s.message='Construct the Research Lab first.';
     else if(s.researchQueue) s.message='Research already in progress.';
     else if(spend({energy:120})){ let dur=s.commanders.includes(3)?16:20; s.researchQueue={name:`Protocol ${s.tech+1}`,end:Date.now()+dur*1000}; s.message='Research initiated.'; closeSheet(); }
     else s.message='Not enough energy.';
   }
   if(act==='inspect'){inspectSite(Number(parts[1]));}
   if(act==='reports'){reportSheet();}
   if(act==='scout'){const i=Number(parts[1]);if(!s.scouted.includes(i)&&spend({energy:10})){s.scouted.push(i);s.message='Recon complete.';}inspectSite(i);}
   if(act==='elite'){if(s.l.barracks>=2&&!s.training&&spend({food:80,alloy:80})){s.training={unit:'elites',count:2,end:Date.now()+25000};s.message='Elite training initiated.';closeSheet();}}
   if(act==='gather'){const k=parts[1];if(['food','water','energy','alloy'].includes(k)&&!s.gather&&s.guards>=4){s.gather={resource:k,amount:180+s.l.core*40,end:Date.now()+45000};s.message='Civilian convoy deployed.';}}
   if(act==='deploy'){const i=Number(parts[1]),site=sites[i],n=Number($('alloc')?.value),f=$('formation')?.value,lead=$('leader')?.value,ids=lead==='family'?[4,5,6]:lead==='none'?[]:[Number(lead)];if(site&&formations[f]&&Number.isInteger(n)&&n>0&&n<=freePower()&&s.armies.length<slots()&&!busySite(i)&&!s.territory.includes(i)&&ids.every(id=>availableLeaders().includes(id))){const power=planPower(n,ids,f),start=Date.now();s.armies.push({site:i,power,reserve:n,leaders:ids,formation:formations[f].name.toLowerCase(),start,end:start+site.time*1000*(f==='recon'?.7:1)});if(ids.length===3)s.familyMarches++;s.message='Army deployed · '+power+' attack power.';closeSheet();}else s.message='Army or commander unavailable.';}
   if(act==='cmd'){ recruitSheet(Number(parts[1])); }
   if(act==='recruit'){
     const id=Number(parts[1]); const c=commanders.find(x=>x.id===id);
     if(s.commanders.includes(id)) s.message='Already recruited.';
     else if(spend({alloy:c.cost})){ s.commanders.push(id); s.cmdLv[id]=1; s.cmdGear[id]=[]; if(id===2) s.trust=Math.min(100,s.trust+10); s.message=`${c.name} joined your command.`; closeSheet(); }
     else s.message='Not enough alloy.';
   }
   if(act==='cmdlevel'){
     const id=Number(parts[1]);
     if(!s.commanders.includes(id)) s.message='Recruit this commander first.';
     else if(s.inv.manuals<1) s.message='No training manuals available.';
     else { s.inv.manuals -=1; s.cmdLv[id]=(s.cmdLv[id]||1)+1; s.commanderLevel=Math.max(s.commanderLevel, Math.ceil(Object.values(s.cmdLv).reduce((a,b)=>a+b,0)/Math.max(1,Object.keys(s.cmdLv).length))); s.message='Commander leveled up.'; }
   }
   if(act==='gear'){ manageGear(Number(parts[1])); }
   if(act==='equip'){
     const id=Number(parts[1]), gearId=parts[2]; s.cmdGear[id]=s.cmdGear[id]||[];
     if(s.cmdGear[id].length>=2) s.message='All gear slots are full.';
     else if(s.cmdGear[id].includes(gearId)) s.message='Already equipped.';
     else if(s.inv.parts<gearList.find(g=>g.id===gearId).cost) s.message='Not enough parts.';
     else { s.inv.parts -= gearList.find(g=>g.id===gearId).cost; s.cmdGear[id].push(gearId); s.message='Gear equipped.'; closeSheet(); }
   }
   if(act==='buy'){
     if(parts[1]==='speed1' && spend({diamond:10})){ s.inv.speed1 +=1; s.message='Purchased a 1 minute speedup.'; }
     if(parts[1]==='crate' && spend({diamond:25})){ s.inv.crates +=1; s.message='Purchased a supply crate.'; }
   }
   if(act==='heal'){
     if(s.injured<1) s.message='No injured troops.';
     else if(s.l.med<1) s.message='Build the Infirmary first.';
     else if(spend({water:25})){ s.injured -=1; s.message='One injured troop healed.'; closeSheet(); }
     else s.message='Not enough water.';
   }
   if(act==='alliance'){
     s.alliance='Last Light'; s.allianceCoins += 20; s.message='You joined the Last Light alliance.';
   }
   if(act==='donate'){
     if(!s.alliance) s.message='Join an alliance first.';
     else if(spend({alloy:50})){ s.donations +=1; s.allianceCoins += 15; vipGain(5); s.message='Donation complete. Alliance power grows.'; }
     else s.message='Not enough alloy.';
   }
   if(act==='daily'){
     const id=parts[1]; const m=currentDaily().find(x=>x.id===id);
     if(m && !s.dailyClaimed.includes(id) && m.done()){ reward(m.reward); s.dailyClaimed.push(id); vipGain(15); s.message='Daily mission reward claimed.'; }
   }
   if(act==='event'){ eventSheet(parts[1]); }
   if(act==='choice'){ handleChoice(parts[1],parts[2]); }
   if(act==='chapter'){
     const ch=nextChapter(); if(ch && ch.done(s)){ reward(ch.reward); s.chapter += 1; vipGain(25); s.message='Chapter reward claimed.'; }
   }
   if(act==='crate'){ openCrate(); }
   if(act==='awaken'){
     if(!s.legacyOath){
       if(parts[1]==='protect'){ s.legacyOath='Protect Life'; s.trust=Math.min(100,s.trust+10); }
       if(parts[1]==='explore'){ s.legacyOath='Claim the Frontier'; s.res.alloy+=300; }
       if(parts[1]==='invent'){ s.legacyOath='Power the Future'; s.res.energy+=250; }
       s.message='The brothers have taken their oath.';
     }
   }
   if(act==='brother'){
     const id=Number(parts[1]);
     if(!s.commanders.includes(id)) s.message='Recruit this brother first.';
     else if((s.brotherRanks[id]||0)>=3) s.message='Signature ability already maxed.';
     else if(s.inv.manuals<1) s.message='No training manuals available.';
     else { s.inv.manuals-=1; s.brotherRanks[id]=(s.brotherRanks[id]||0)+1; s.message='Signature ability improved.'; }
   }
   if(act==='bond'){
     if(!s.brotherBonded && [4,5,6].every(id=>s.commanders.includes(id)) && [4,5,6].every(id=>(s.brotherRanks[id]||0)>=1)){
       s.brotherBonded=true; s.trust=Math.min(100,s.trust+15); s.res.diamond+=50; s.message='Brothers of Afterlight bond activated.';
     }
   }
   if(act==='loginreward'&&s.loginDay!==dayKey()){const r=loginReward();s.loginStreak=s.loginDay===dayKey(-1)?s.loginStreak+1:1;s.loginDay=dayKey();reward(r);vipGain(35);s.message='Daily supply drop collected.';}
   if(act==='allytech'){const k=parts[1];if(s.alliance&&['industry','fortification'].includes(k)&&s.allianceTech[k]<5){const cost=30*(s.allianceTech[k]+1);if(s.allianceCoins>=cost){s.allianceCoins-=cost;s.allianceTech[k]++;s.message='Alliance research completed.';}}}
   citySignature=''; render();
 });
 document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
 $('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeSheet(); });
 render();
 setInterval(render,1000);
</script>
</body>
</html>
