<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Afterlight: Dominion</title><style>
*{box-sizing:border-box}body{margin:0;background:#101716;color:#e4e9df;font:14px system-ui}main{max-width:850px;margin:auto}header{padding:20px;background:linear-gradient(120deg,#34483e,#151c1c);border-bottom:1px solid #83917b}h1{margin:0;letter-spacing:5px;font-size:25px}small{color:#a8b8a9}button{font:inherit;color:inherit;background:#35493e;border:1px solid #72846d;border-radius:7px;padding:12px;cursor:pointer}button:disabled{opacity:.45}#resources{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px}#resources div{text-align:center;background:#23312b;padding:7px;border-radius:5px}#resources b{display:block;font-size:18px}.panel{padding:12px}.mission{margin:8px;padding:12px;border:1px solid #a28b56;background:#302d23;border-radius:8px}.mission button{margin-top:9px;width:100%;background:#71613b}#map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:repeating-linear-gradient(45deg,#202b25 0 24px,#25332b 25px 26px);padding:12px}.tile{padding:5px;min-height:112px;background:linear-gradient(#3c4a3c,#202b25);box-shadow:inset 0 -5px #0005}.tile svg{width:100%;height:68px;display:block}.tile b,.tile small{display:block}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;position:sticky;bottom:0;background:#101716}.tabs button{padding:10px 2px;font-size:12px}.active{border-color:#d4d88f;background:#536344}.item{padding:12px;margin:8px 0;background:#25332d;border:1px solid #506458;border-radius:8px}.item button{margin:5px 4px 0 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}#message{padding:8px 12px;color:#e0c58d;min-height:35px}#detail{padding:0 12px}h2,h3{margin:5px 0 10px}p{line-height:1.45}.danger{background:#643b34}.bar{height:8px;background:#101716;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#a5c181}footer{padding:12px;color:#a8b8a9;font-size:11px}</style></head><body><main><header><small>COLONY NETWORK / SECTOR 07</small><h1>AFTERLIGHT</h1><div class="row"><span>DOMINION • 2033</span><b id="power"></b></div></header><div id="resources"></div><div id="mission" class="mission"></div><div id="message" role="status"></div><div id="view"></div><div id="detail"></div><nav class="tabs" id="tabs"></nav><footer id="footer"></footer></main><script>
'use strict';const $=id=>document.getElementById(id);const defs=[['core','AI Core','◈',100],['reactor','Reactor','ϟ',60],['farm','Hydroponics','♧',50],['water','Purifier','≈',50],['quarters','Quarters','▤',60],['lab','Research Lab','⌬',80],['barracks','Barracks','⛨',70],['med','Infirmary','✚',70],['forge','Workshop','⚙',60]];const sites=[['Supply depot',2,140],['Relay tower',4,220],['Abandoned hospital',6,300],['Industrial district',9,450],['Data vault',12,700],['Machine outpost',16,1000]];const heroes=[['Mara Voss','Engineer: construction 30% faster'],['Silas Reed','Scout: +50 alloy per territory'],['Lena Cross','Medic: +10 trust on recruitment']];const fresh=()=>({r:[250,200,200,450],l:Object.fromEntries(defs.map((d,i)=>[d[0],[0,1,2,3,4,8].includes(i)?1:0])),people:4,trust:50,moral:0,guards:0,drones:0,tech:0,heroes:[],territory:[],events:[],chapter:0,queue:null,last:Date.now()});let s=fresh(),tab='Base',sel='',msg='AI online. Commander, we have company.',storage=true;try{let x=JSON.parse(localStorage.getItem('afterlight03'));if(x&&x.l&&x.r)s=x}catch(e){storage=false}function save(){try{localStorage.setItem('afterlight03',JSON.stringify(s))}catch(e){storage=false}}function tick(){let now=Date.now(),dt=Math.min(14400,Math.max(0,(now-s.last)/1000));s.r=s.r.map((v,i)=>Math.min(99999,v+dt*[s.l.farm*.5,s.l.water*.5,s.l.reactor*.4,s.l.forge*.45][i]));s.last=now;if(s.queue&&now>=s.queue.end){s.l[s.queue.id]++;msg='Construction completed: '+s.queue.id;s.queue=null}save()}function cost(d){return Math.ceil(d[3]*1.65**s.l[d[0]])}function strength(){return s.guards+s.drones*2+s.tech}function pwr(){return Object.values(s.l).reduce((a,b)=>a+b,0)*100+strength()*40+s.heroes.length*150+s.territory.length*200}function mission(){let m=[['The Knock','Resolve the strangers at the blast door.',s.events.length>0,'event'],['Restore command','Upgrade AI Core to level 2.',s.l.core>=2,'core'],['Raise a defense','Construct Barracks.',s.l.barracks>0,'barracks'],['First squad','Train 2 guards.',s.guards>=2,'barracks'],['Beyond the walls','Capture the supply depot.',s.territory.includes(0),'World'],['New leadership','Recruit a commander.',s.heroes.length>0,'Heroes'],['Machine intelligence','Research one technology.',s.tech>0,'lab'],['The refugees','Decide the fate of another group.',s.events.length>1,'event']][s.chapter];return m}function art(i){let c=['#a8bca4','#b6a16a','#7fa879','#719da9','#b2a28a','#9d99b7','#a17f6c','#8cb5ac','#a6a17c'][i];return `<svg viewBox="0 0 100 70"><path d="M4 46L50 22 96 46 50 69Z" fill="#14221c" stroke="#687b67"/><path d="M14 24L50 5 86 24 50 43Z" fill="${c}" stroke="#d0d5bd"/><path d="M14 24V45L50 64V43Z" fill="#526452"/><path d="M86 24V45L50 64V43Z" fill="#34493e"/><path d="M20 34L31 40V48L20 42Z M37 43L45 47V55L37 51Z" fill="${s.l[defs[i][0]]?'#d2e7a3':'#283b31'}"/><text x="50" y="29" font-size="20" font-weight="bold" text-anchor="middle" fill="#263a30">${defs[i][2]}</text></svg>`}function button(a,t,disabled=false){return `<button data-a="${a}" ${disabled?'disabled':''}>${t}</button>`}function render(){tick();$('power').textContent='⚡ '+pwr().toLocaleString();$('resources').innerHTML=['🌾 Food','💧 Water','⚡ Energy','⚙ Alloy'].map((n,i)=>`<div>${n}<b>${Math.floor(s.r[i])}</b></div>`).join('');let m=mission();$('mission').innerHTML=m?`<small>CHAPTER ${s.chapter+1} / 8</small><h3>${m[0]}</h3>${m[1]}${button(m[2]?'claim':'quest',m[2]?'Claim reward · 150 alloy':'Go to objective')}`:'<b>Chapter campaign complete. Expand your civilization.</b>'; $('message').textContent=msg+(s.queue?' • Construction: '+Math.max(0,Math.ceil((s.queue.end-Date.now())/1000))+'s':'');$('tabs').innerHTML=['Base','World','Heroes','AI'].map(t=>`<button data-a="tab:${t}" class="${tab===t?'active':''}">${t}</button>`).join('');let v='';if(tab==='Base')v='<div id="map">'+defs.map((d,i)=>`<button class="tile" data-a="room:${d[0]}">${art(i)}<b>${d[1]}</b><small>${s.l[d[0]]?'LEVEL '+s.l[d[0]]:'BUILD'}</small></button>`).join('')+'</div>';if(tab==='World')v='<div class="panel"><h2>Wasteland operations</h2><p>Squad strength: '+strength()+' • Controlled sectors: '+s.territory.length+'/6</p><div id="map">'+sites.map((x,i)=>`<button class="tile" data-a="site:${i}" ${s.territory.includes(i)?'disabled':''}>${['▤','⌁','✚','⚙','◈','⛨'][i]}<b>${x[0]}</b><small>${s.territory.includes(i)?'CONTROLLED':'Strength '+x[1]}</small></button>`).join('')+'</div></div>';if(tab==='Heroes')v='<div class="panel"><h2>Commanders</h2>'+heroes.map((h,i)=>`<div class="item"><small>SPECIALIST 0${i+1}</small><h3>${h[0]}</h3>${h[1]}<br>${button('hero:'+i,s.heroes.includes(i)?'Recruited':'Recruit · 120 alloy',s.heroes.includes(i))}</div>`).join('')+'</div>';if(tab==='AI')v=`<div class="panel"><div class="item"><small>NEURAL ALIGNMENT</small><h2>${s.moral>0?'Guardian':s.moral<0?'Dominion':'Observer'}</h2>Trust: ${s.trust}%<div class="bar"><i style="width:${s.trust}%"></i></div><p>Population: ${s.people} / ${s.l.quarters*8+4}<br>Research: ${s.tech}<br>Guards: ${s.guards} • Drones: ${s.drones}</p></div>${button('event','Open pending transmission',s.events.length>=2||s.events.length===1&&s.chapter<7)}</div>`;$('view').innerHTML=v;let d=defs.find(x=>x[0]===sel);$('detail').innerHTML=d?`<div class="item"><div class="row"><h3>${d[1]} · LV ${s.l[sel]}</h3>${button('close','×')}</div>${button('upgrade',(s.l[sel]?'Upgrade':'Construct')+' · '+cost(d)+' alloy',!!s.queue||(sel!=='core'&&s.l[sel]>=s.l.core))}${sel==='barracks'?button('train','Train 2 guards · 30 food + 30 alloy',!s.l.barracks)+button('drone','Build drone · 60 energy + 50 alloy',s.l.barracks<2):''}${sel==='lab'?button('research','Research · 100 energy',!s.l.lab):''}<p><small>${sel!=='core'&&s.l[sel]>=s.l.core?'Upgrade AI Core first.':'Construction uses one shared queue.'}</small></p></div>`:sel==='event'?`<div class="item"><h3>${s.events.length?'The Refugees':'The Knock'}</h3><p>${s.events.length?'A sick group requests supplies. Your AI warns of limited capacity.':'Six strangers are at the blast door. One child is injured; two adults carry weapons.'}</p>${button('choice:1','Offer aid and shelter · 40 food')}${button('choice:0','Offer limited aid · 20 food')}${button('choice:-1','Reject them and lock down')}<br>${button('close','Decide later')}</div>`:'';$('footer').textContent='V0.3 • '+(storage?'Local browser save enabled':'Storage blocked; session only')+' • Offline single player';}
function spend(i,n){if(s.r[i]<n)return false;s.r[i]-=n;return true}function act(a){tick();let [k,x]=a.split(':');if(k==='tab'){tab=x;sel=''}else if(k==='room'){sel=x}else if(k==='close'){sel=''}else if(k==='quest'){let m=mission();if(m){if(m[3]==='event'){sel='event'}else if(['World','Heroes'].includes(m[3])){tab=m[3];sel=''}else{tab='Base';sel=m[3]}}}else if(k==='claim'){let m=mission();if(m&&m[2]){s.chapter++;s.r[3]+=150;msg='Chapter reward received.'}}else if(k==='event'){if(s.events.length<2&&(s.events.length===0||s.chapter>=7))sel='event'}else if(k==='choice'){if(s.events.length<2&&(s.events.length===0||s.chapter>=7)){let v=Number(x),food=v===1?40:v===0?20:0;if(v===1&&s.people+6>s.l.quarters*8+4){msg='Upgrade quarters to admit everyone.'}else if(spend(0,food)){s.events.push(v);s.moral+=v;s.people+=v===1?6:v===0?2:0;s.trust=Math.max(0,Math.min(100,s.trust+(v===1?20:v===0?5:-15)));sel='';msg='AI alignment updated.'}else msg='Not enough food.'}}else if(k==='upgrade'){let d=defs.find(x=>x[0]===sel);if(d&&!s.queue&&(sel==='core'||s.l[sel]<s.l.core)&&spend(3,cost(d))){s.queue={id:sel,end:Date.now()+(8+4*s.l[sel])*(s.heroes.includes(0)?.7:1)*1000};msg='Construction started.'}else msg='Not enough alloy or construction unavailable.'}else if(k==='train'){if(s.l.barracks&&s.r[0]>=30&&s.r[3]>=30){s.r[0]-=30;s.r[3]-=30;s.guards+=2;msg='Two guards trained.'}else msg='Training requirements not met.'}else if(k==='drone'){if(s.l.barracks>=2&&s.r[2]>=60&&s.r[3]>=50){s.r[2]-=60;s.r[3]-=50;s.drones++;msg='Drone deployed.'}else msg='Drone requirements not met.'}else if(k==='research'){if(s.l.lab&&spend(2,100)){s.tech++;msg='Research complete.'}else msg='Research requirements not met.'}else if(k==='hero'){let i=Number(x);if(!s.heroes.includes(i)&&spend(3,120)){s.heroes.push(i);if(i===2)s.trust=Math.min(100,s.trust+10);msg='Commander recruited.'}else msg='Insufficient alloy.'}else if(k==='site'){let i=Number(x);if(!s.territory.includes(i)&&strength()>=sites[i][1]){s.territory.push(i);s.r[3]+=sites[i][2]+(s.heroes.includes(1)?50:0);msg='Sector captured. Supplies recovered.'}else msg='Increase squad strength first.'}render()}document.addEventListener('click',e=>{let b=e.target.closest('button[data-a]');if(b&&!b.disabled)act(b.dataset.a)});render();setInterval(render,1000);
</script></body></html>
