<style>
:root{

  --green:#89b56a; --green2:#5f8448; --gold:#d1b36b; --red:#b15d59; --cyan:#69b1c4; --purple:#8d86d6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,#0a0f11,#0d1418 22%,#10181d);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #50625c;background:linear-gradient(180deg,#30443c,#24342d);color:var(--text);border-radius:12px;padding:12px 14px}
button:disabled{opacity:.45;cursor:default}
main{max-width:980px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:0;z-index:50;background:rgba(7,12,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid #253036;padding:env(safe-area-inset-top) 10px 8px}
.brandrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:6px}
.brand h1{margin:0;font-size:23px;letter-spacing:4px}
.brand small{color:#adc0b9;letter-spacing:1.3px}
.mini{font-size:12px;color:#bfcac7}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#151e22;border:1px solid #2f4048;border-radius:999px;padding:6px 10px;font-size:12px;color:#dce6df}
.resbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}

.res span{display:block;color:#90a49c;font-size:11px}
.res b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heroStrip{display:flex;gap:8px;overflow:auto;padding:10px 10px 0}

.notice{margin:10px;background:#2b2418;border:1px solid #5e4d2d;color:#ebd7aa;padding:12px 14px;border-radius:14px}
.flex{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:#1e2b30;border:1px solid #395058;padding:5px 9px;border-radius:999px;font-size:12px;color:#dce4e1}

.tile{position:relative;min-height:150px;background:linear-gradient(180deg,#2b3636,#1a2325);border:1px solid #4c5c60;border-radius:18px;overflow:hidden;box-shadow:inset 0 -12px 24px #00000030}

.iso{width:112px;height:70px;position:relative;filter:drop-shadow(0 10px 10px #00000044)}
.iso .topa,.iso .side1,.iso .side2,.iso .win,.iso .roof{position:absolute;display:block}

.iso .side1{left:4px;top:24px;width:48px;height:32px;background:color-mix(in srgb,var(--c) 55%, #30423e);transform:skewY(28deg);border:1px solid #233532}
.iso .side2{left:50px;top:24px;width:48px;height:32px;background:color-mix(in srgb,var(--c) 40%, #1f2d2a);transform:skewY(-28deg);border:1px solid #233532}
.iso .win{left:40px;top:34px;width:14px;height:10px;background:#c7ef9a;box-shadow:18px -3px 0 #c7ef9a, -18px 3px 0 #c7ef9a}
.tile .info{padding:8px 12px 12px}
.tile .name{font-weight:700;font-size:15px}
.tile small{color:#afc0ba}
.badge{position:absolute;top:10px;right:10px;background:#0d1518;border:1px solid #3d5155;border-radius:999px;padding:5px 8px;font-size:11px}
.timer{position:absolute;left:10px;top:10px;background:#47331a;border:1px solid #9d7c45;color:#f2dfb0;border-radius:999px;padding:4px 8px;font-size:11px}
.tile.locked{filter:saturate(.3);opacity:.7}
.tile .cta{position:absolute;inset:auto 10px 10px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:linear-gradient(180deg,#1c272c,#151d21);border:1px solid #34454d;border-radius:16px;padding:12px}
.card h3,.panel h3,.panel h2{margin:0 0 8px}
.card p{margin:6px 0;color:#b6c5c0;line-height:1.35}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,15,18,.97);backdrop-filter:blur(10px);border-top:1px solid #263239;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabsInner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tabbtn{padding:10px 4px;border-radius:14px;font-size:11px;background:#11181c;border:1px solid #27353d;color:#d3dfdc}
.tabbtn.active{background:linear-gradient(180deg,#465a4d,#2f4137);border-color:#90a97c}
.list{display:grid;gap:10px}
.cmd{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.portrait{width:72px;height:72px;border-radius:16px;background:radial-gradient(circle at 35% 30%,#778b94,#29353e 60%);border:1px solid #546670;display:flex;align-items:end;justify-content:center;font-size:42px}
.stars{letter-spacing:2px;color:#f2cf77}
.site{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:linear-gradient(180deg,#1b262b,#141c20);border:1px solid #34454d;border-radius:16px;padding:12px}
.site .icon{width:54px;height:54px;border-radius:14px;background:#243137;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid #42575e}
.mission{background:linear-gradient(180deg,#2e2819,#1e1a12);border:1px solid #5e4f2e;border-radius:16px;padding:12px;margin:10px}
.inventory{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:linear-gradient(180deg,#1b262c,#141d21);border:1px solid #35474e;border-radius:16px;padding:12px}
.item .icon{font-size:28px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.center{text-align:center}
.small{font-size:12px;color:#9fb1ab}
.big{font-size:22px;font-weight:800}
.footer{padding:14px;text-align:center;color:#8fa19b;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:100}
.modal.show{display:flex}
.sheet{width:100%;max-width:980px;margin:0 auto;background:linear-gradient(180deg,#172127,#10181d);border-radius:22px 22px 0 0;border-top:1px solid #374750;max-height:86vh;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .close{float:right;padding:6px 10px}
.line{height:1px;background:#28363b;margin:12px 0}
@media (max-width:700px){
  .resbar{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
  .inventory{grid-template-columns:1fr 1fr}
  .hq{min-width:640px}
}

function parseCivilizationSave(raw){
 const p=JSON.parse(raw),base=fresh();
 const record=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
 if(!record(p)||!record(p.l)||!record(p.res)||!Array.isArray(p.commanders))throw Error('Invalid civilization save');
 for(const k of ['res','l','inv'])if(p[k]!==undefined&&(!record(p[k])||Object.values(p[k]).some(v=>typeof v!=='number'||!Number.isFinite(v)||v<0)))throw Error('Invalid '+k+' values');
 if(!Number.isInteger(p.l.core)||p.l.core<1||p.commanders.some(i=>!Number.isInteger(i)||i<0||i>=commanders.length))throw Error('Invalid commander or core data');
 for(const k of ['territory','armies','reports','dailyClaimed','achievementClaims'])if(p[k]!==undefined&&!Array.isArray(p[k]))throw Error('Invalid '+k);
 for(const k of ['cmdLv','cmdGear','flags','skills','familyNames','allianceTech','brotherRanks','surface','legendGear'])if(p[k]!==undefined&&!record(p[k]))throw Error('Invalid '+k);
 if(p.queue!=null&&(!record(p.queue)||!defs.some(d=>d.id===p.queue.id)||!Number.isFinite(p.queue.end)))throw Error('Invalid construction queue');
 if(p.depot!=null){
  const d=p.depot,b=d.battle;
  if(!record(d)||!['Raid','Haul','Hold'].includes(d.crew)||!record(d.leaders)||typeof d.captured!=='boolean'||!Number.isFinite(d.arrival)||d.arrival<0||Object.values(d.leaders).some(i=>i!==-1&&!p.commanders.includes(i)))throw Error('Invalid depot crew');
  if(b!=null&&(!record(b)||d.captured||d.arrival||!Array.isArray(b.board)||b.board.length!==25||b.board.some(v=>!Number.isInteger(v)||v<0||v>3)||['hp','enemy','guard','charge','turn'].some(k=>!Number.isSafeInteger(b[k])||b[k]<0)||(b.selected!==null&&(!Number.isInteger(b.selected)||b.selected<0||b.selected>24))))throw Error('Invalid depot battle');
 }
 const result={...base,...p,res:{...base.res,...p.res},l:{...base.l,...p.l},inv:{...base.inv,...p.inv},flags:{...base.flags,...p.flags}};
 if(!Number.isFinite(result.last)||result.last<=0)result.last=Date.now();
 return result;
}

 if(s.loginDay!==today)out.push({name:'Daily supply drop',claim:()=>{reward(loginReward());s.loginStreak=s.loginDay===dayKey(-1)?s.loginStreak+1:1;s.loginDay=today;vipGain(35);}});
 const n=Math.max(0,Math.min(7,Math.floor(Number(s.welcomeDays)||0)));
 const gifts=[{alloy:200},{food:300,water:300},{manuals:2},{energy:400},{parts:3},{speed1:3},{diamond:75,manuals:3}];
 if(n<7&&s.welcomeLast!==today)out.push({name:'Welcome package '+(n+1),claim:()=>{reward(gifts[n]);s.welcomeDays=n+1;s.welcomeLast=today;}});
 const x=s.commanderExpedition,t=x&&expeditionTypes[x.type];
 if(t&&Date.now()>=x.end)out.push({name:'Completed expedition',claim:()=>{reward(t.loot);s.commanderExpedition=null;s.expeditionsCompleted=(s.expeditionsCompleted||0)+1;if(s.weeklyExpeditionEvent?.week!==w)s.weeklyExpeditionEvent={week:w,count:0,claimed:false};s.weeklyExpeditionEvent.count++;}});
 const v=s.weeklyExpeditionEvent;
 if(v?.week===w&&v.count>=3&&!v.claimed)out.push({name:'Weekly Frontier Survey',claim:()=>{v.claimed=true;reward({alloy:300,diamond:25});}});
 for(const a of achievementDefs())if(a[2]&&!(s.achievementClaims||[]).includes(a[0]))out.push({name:a[1],claim:()=>{(s.achievementClaims??=[]).push(a[0]);reward(a[3]);}});
 return out;
}

 try{const a=b.dataset.recovery;

function defense(){return (setBonus(0)*20+(s.commanders.includes(4)?12:0)+(s.brotherRanks?.[4]||0)*8+Math.max(0,armyPower()-(unitsHome()-freePower()))+s.l.wall*12+s.l.turret*30+s.l.shield*40+(s.protocol==='guardian'?25:0)+(s.brotherBonded?15:0)+s.allianceTech.fortification*10)*(1+.05*researchRank('fortification'))}
function restoreCivilization(raw,message){
 const valid=parseCivilizationSave(raw);
 if(!confirm(message))return;
 const original=localStorage.getItem(key);
 if(original)localStorage.setItem(key+'_before_restore',original);
 localStorage.setItem(key,JSON.stringify(valid));
 saveBlocked=true;
 location.reload();
}
function save(){if(saveBlocked)return;try{const now=Date.now(),raw=JSON.stringify(s);if(now-lastBackupAt>=60000){const prev=localStorage.getItem(key);if(prev){try{parseCivilizationSave(prev);localStorage.setItem(backupKey,prev);}catch(e){}}lastBackupAt=now;}localStorage.setItem(key,raw);storage=true;}catch(e){storage=false;}}
function prodRates(){
  const base={
    food:surfaceRate('food')+s.l.farm*0.72 + s.people*0.02,
    water:surfaceRate('water')+s.l.water*0.68,
    energy:setBonus(2)*.5+surfaceRate('energy')+s.l.reactor*0.62+(s.commanders.includes(6)?.4:0)+((s.brotherRanks?.[6]||0)*0.25),
    alloy:surfaceRate('alloy')+s.allianceTech.industry*.15+s.l.forge*0.58 + (s.protocol==='observer'?.3:0) + (s.territory.includes(3)?0.18:0),
  };return Object.fromEntries(Object.entries(base).map(([k,v])=>[k,v*(1+.08*researchRank('production'))]));
}
function armyPower(st=s){
  return (setBonus(1,st)*12+(st.commanders.includes(5)?10:0)+((st.brotherRanks?.[5]||0)*6)+(st.brotherBonded?15:0)+Math.max(0,st.guards-st.injured)*2 + st.drones*5 + (st.elites||0)*4 + st.tech*3 + st.commanders.reduce((n,id)=>n+3+((st.cmdLv[id]||1)-1)*2+(st.cmdGear[id]||[]).length,0) + st.l.wall + (st.cyber||0)*8 + (st.sentinels||0)*14 + (st.protocol==='dominion'?20:0) + Object.values(st.skills||{}).reduce((a,b)=>a+b*4,0) + Object.values(st.promotions||{}).reduce((a,b)=>a+b*5,0))*(1+.04*researchRank('weapons',st));
}
function totalPower(){
  return Object.values(s.surface).reduce((a,b)=>a+b,0)*180+Object.values(s.l).reduce((a,b)=>a+b,0)*120 + armyPower()*45 + s.commanders.length*180 + s.tech*120 + s.territory.length*220;
}

function popCap(){ return 6 + s.l.quarters*10; }
function commanderManualCost(id){return Math.max(1,Math.ceil((s.cmdLv[id]||1)/2));}
function buildingCost(id){ const d=defs.find(x=>x.id===id); return Math.round(d.base*Math.pow(1.58,s.l[id]||0)); }
const coreBuildSeconds=[0,10,30,180,600,1800,3600,7200,14400,21600,43200,64800,86400,108000,129600,172800,216000,259200,345600,432000,518400,604800,691200,864000,1036800,1209600,1468800,1814400,2160000,2592000,3024000];
const corePrerequisites={2:['reactor','farm'],3:['wall','barracks'],4:['wall','lab'],5:['wall','forge'],6:['wall','med'],7:['wall','market'],8:['wall','lab'],9:['wall','hangar'],10:['wall','barracks']};
function buildRequirements(id){const level=s.l[id]||0;if(id!=='core')return [];if(level>=30)return [];const target=level+1;const rotation=['reactor','farm','water','quarters','barracks','forge','med','market','hangar'];const ids=corePrerequisites[target]||['wall',rotation[(target-11)%rotation.length],...(target%5===0?['lab']:[])];return [...new Set(ids)].map(k=>({id:k,level,name:defs.find(d=>d.id===k)?.name||k,met:(s.l[k]||0)>=level}));}
function coreRequirementPanel(id){const req=buildRequirements(id);if(!req.length)return '';return '<div class="card"><h3>Next Core prerequisites</h3>'+req.map(q=>'<div class="row"><span>'+ (q.met?'✓ ':'○ ')+q.name+' · '+(s.l[q.id]||0)+' / '+q.level+'</span><button data-act="open:'+q.id+'">'+(q.met?'View':'Go to building')+'</button></div>').join('')+'</div>';}
const researchNodes=[{id:'engineering',name:'Engineering',branch:'Development',lab:1,desc:'5% faster construction per rank'},{id:'analysis',name:'Applied science',branch:'Development',lab:2,req:'engineering',desc:'5% faster research per rank'},{id:'production',name:'Industrial logistics',branch:'Economy',lab:1,desc:'8% more resource production per rank'},{id:'weapons',name:'Combat doctrine',branch:'Military',lab:2,desc:'4% more army power per rank'},{id:'fortification',name:'Fortified defenses',branch:'Defense',lab:2,desc:'5% more defense per rank'},{id:'mechanized',name:'Mechanized warfare',branch:'Advanced technology',lab:3,req:'weapons',desc:'Unlocks cyber infantry and sentinel training at rank 1'}];
function researchRank(id,st=s){return Math.max(0,Math.min(5,Number(st.researchRanks?.[id])||0));}
function researchSpec(n){const rank=researchRank(n.id),lv=rank+1;return {rank,lab:n.lab+rank,cost:{energy:120*lv*lv,alloy:60*lv*lv},seconds:Math.max(5,Math.round(180*lv*lv*(s.commanders.includes(3)?.8:1)*(1-.05*researchRank('analysis')))),locked:rank>=5||s.l.lab<n.lab+rank||(n.req&&researchRank(n.req)<1)};}
function researchTree(){return '<div class="card"><h3>Research Center</h3><p>'+(s.researchQueue?'Active: '+safeBattleText(s.researchQueue.name)+' · '+timeLeft(s.researchQueue.end):'Research queue idle')+'</p>'+researchNodes.map(n=>{const q=researchSpec(n);return '<div class="card"><small>'+n.branch+'</small><h3>'+n.name+' · '+q.rank+'/5</h3><p>'+n.desc+'</p><p>Lab '+q.lab+(n.req?' · requires '+researchNodes.find(v=>v.id===n.req).name+' rank 1':'')+' · '+fmt(q.cost.energy)+' energy · '+fmt(q.cost.alloy)+' alloy · '+durationText(q.seconds)+'</p><button data-act="researchnode:'+n.id+'" '+(q.locked||s.researchQueue||!canAfford(q.cost)?'disabled':'')+'>'+(q.rank>=5?'Max rank':'Research rank '+(q.rank+1))+'</button></div>';}).join('')+'</div>';}
function queueSeconds(id){const level=(s.l[id]||0)+1;let t=coreBuildSeconds[Math.min(30,level)]*(id==='core'?1:.5);if(s.commanders.includes(0))t*=.8;t*=Math.max(.55,1-(s.skills[0]||0)*.06);t*=1-.05*researchRank('engineering');return Math.max(1,Math.round(t*Math.max(.6,1-s.vip*.02)));}
function durationText(seconds){const n=Math.max(0,Math.ceil(seconds)),d=Math.floor(n/86400),h=Math.floor(n/3600)%24,m=Math.floor(n/60)%60;return d?d+'d '+h+'h':h?h+'h '+m+'m':m?m+'m '+n%60+'s':n+'s';}
const speedItems=[{mins:1,price:10},{mins:5,price:40},{mins:15,price:100},{mins:60,price:320},{mins:480,price:2100},{mins:1440,price:5500}];

function supplyExchange(){return '<div class="card"><h3>Resource & speed-up exchange</h3><p>Spend earned diamonds, not real money. Market level 1 required.</p>'+speedItems.map(v=>'<button data-act="buy:speed'+v.mins+'" '+(s.l.market<1||s.res.diamond<v.price?'disabled':'')+'>'+durationText(v.mins*60)+' · '+v.price+' diamonds</button>').join(' ')+'<div class="line"></div>'+[['alloy','Alloy'],['food','Food'],['water','Water'],['energy','Energy']].map(([k,n])=>'<button data-act="supply:'+k+'" '+(s.l.market<1||s.res.diamond<25?'disabled':'')+'>'+fmt(500*Math.max(1,s.l.core))+' '+n+' · 25 diamonds</button>').join(' ')+'</div>';}
function currentDaily(){
  if(s.dailySeed!==new Date().toDateString()){ s.dailySeed=new Date().toDateString(); s.dailyClaimed=[]; }

    {id:'daily1',name:'Hold 400 food',done:()=>s.res.food>=400,reward:{alloy:70}},

function tick(){
 if(depotAdvance()&&$('depotSheet')&&$('modal').classList.contains('show'))depotSheet();
 if(s.bossRun&&Date.now()>=s.bossRun.end){const b=s.bossRun;const win=b.power>=b.enemy;const injured=win?0:Math.min(Math.max(0,s.guards-s.injured),3);s.injured+=injured;if(win){s.bossWins++;reward({parts:4,manuals:2,alloy:300,diamond:25});}s.reports.unshift({name:'Leviathan',win,power:b.power,enemy:b.enemy,injured,leaders:b.leaders,formation:'Boss assault',at:Date.now()});s.reports=s.reports.slice(0,30);s.bossRun=null;s.bossCooldown=Date.now()+60000;s.message=win?'Leviathan defeated. Legendary materials recovered.':'Leviathan repelled your forces.';}

 if(s.surfaceQueue&&Date.now()>=s.surfaceQueue.end){const i=s.surfaceQueue.id;s.surface[i]=(s.surface[i]||0)+1;s.surfaceQueue=null;s.message=districts[i].name+" completed.";}
  const now=Date.now();
  let dt=Math.max(0,Math.min(60*60*6,Math.floor((now-s.last)/1000)));
  if(dt>0){
    const p=prodRates();
    s.res.food=Math.min(999999,s.res.food+p.food*dt);
    s.res.water=Math.min(999999,s.res.water+p.water*dt);
    s.res.energy=Math.min(999999,s.res.energy+p.energy*dt);
    s.res.alloy=Math.min(999999,s.res.alloy+p.alloy*dt);
    s.last = now;
  }
  if(s.queue && now>=s.queue.end){
    s.l[s.queue.id] = (s.l[s.queue.id]||0) + 1;
    s.message = `${defs.find(d=>d.id===s.queue.id).name} upgraded successfully.`;
    if(s.queue.id==='quarters') s.popIdle = Math.min(s.people, popCap());
    s.queue = null;
  }
  if(s.researchQueue && now>=s.researchQueue.end){
    s.tech += 1;
    if(researchNodes.some(n=>n.id===s.researchQueue.node)){s.researchRanks??={};const id=s.researchQueue.node;s.researchRanks[id]=Math.min(5,researchRank(id)+1);}
    s.message = `Research complete: ${s.researchQueue.name}.`;
    s.researchQueue = null;
  }
  for(const m of s.armies.filter(m=>now>=m.end)){resolveArmy(m);s.armies=s.armies.filter(x=>x!==m);}
  if(s.gather && now>=s.gather.end){reward({[s.gather.resource]:s.gather.amount});s.gathered++;s.message='Gathering convoy returned: '+s.gather.amount+' '+s.gather.resource;s.gather=null;}
  if(s.training && now>=s.training.end){s[s.training.unit]+=s.training.count;s.message=`Training complete: ${s.training.count} ${s.training.unit}.`;s.training=null;}
  if(s.raid&&now>=s.raid.end){const enemy=s.raid.power,power=defense(),win=power>=enemy;let injured=win?0:Math.min(2,Math.max(0,s.guards-s.injured));s.injured+=injured;if(win){reward({alloy:200,parts:1,diamond:10});s.raidWins++;}else{s.res.alloy=Math.max(0,s.res.alloy-100);}s.reports.push({name:'Bunker defense · '+s.raid.name,power,enemy,win,injured});s.reports=s.reports.slice(-30);s.message=win?'Raid repelled! Rewards recovered.':'Raid breached defenses. Lost up to 100 alloy.';s.raid=null;s.raidCooldown=now+60000;}
  save();
}
function canAfford(costObj){ return Object.entries(costObj).every(([k,v])=> (k in s.res ? s.res[k] : s.inv[k]||0) >= v); }
function spend(costObj){ if(!canAfford(costObj)) return false; for(const [k,v] of Object.entries(costObj)){ if(k in s.res) s.res[k]-=v; else s.inv[k]-=v; } return true; }

let feedbackTimer=null,feedbackTotals={};
function gameFeedback(message){
 if(document.hidden)return;
 let el=document.getElementById('gameFeedback');
 if(!el){el=document.createElement('div');el.id='gameFeedback';el.className='gameFeedback';el.setAttribute('role','status');document.body.appendChild(el);}
 el.textContent=message;el.classList.remove('feedbackPop');void el.offsetWidth;el.classList.add('feedbackPop');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>el.remove(),2400);
}
let rewardFeedbackTimer=null;
function queueRewardFeedback(obj){
 if(document.hidden)return;
 for(const [k,v] of Object.entries(obj))if(Number.isFinite(v)&&v>0)feedbackTotals[k]=(feedbackTotals[k]||0)+v;
 if(rewardFeedbackTimer!==null)return;
 rewardFeedbackTimer=setTimeout(()=>{rewardFeedbackTimer=null;const items=Object.entries(feedbackTotals);feedbackTotals={};if(items.length&&!document.hidden)gameFeedback(items.map(([k,v])=>'+'+fmt(v)+' '+k).join(' · '));},100);
}
function animateDrillHit(oldHp,oldEnemy,action,correct){
 const d=drill,scene=document.querySelector('#sheet .combatScene');if(!d||!scene)return;
 const bars=scene.querySelectorAll('.progress>i');
 const previous=[oldHp,oldEnemy/(d.maxEnemy||100)*100],next=[d.hp,d.enemy/(d.maxEnemy||100)*100];
 bars.forEach((bar,i)=>{if(i>1)return;bar.style.width=previous[i]+'%';void bar.offsetWidth;bar.classList.add('tacticalBar');bar.style.width=next[i]+'%';});
 const labels=[oldHp-d.hp,oldEnemy-d.enemy];
 labels.forEach((n,i)=>{if(!n&&i===1)return;const el=document.createElement('span');el.className='tacticalFloat '+(i===0?'friendlyDamage':'enemyDamage');el.textContent=n?'−'+n:'BLOCKED';scene.appendChild(el);setTimeout(()=>el.remove(),1000);});
 if(correct||action==='ability'){const el=document.createElement('div');el.className='tacticalCall';el.textContent=action==='ability'?'OVERDRIVE':'COUNTER SUCCESS';scene.appendChild(el);setTimeout(()=>el.remove(),1000);}
 scene.classList.add(d.done?(d.enemy===0?'tacticalVictory':'tacticalDefeat'):'tacticalHit');
}

function reward(obj){ for(const [k,v] of Object.entries(obj)){ if(k in s.res) s.res[k]=(s.res[k]||0)+v; else s.inv[k]=(s.inv[k]||0)+v; } queueRewardFeedback(obj); }

 function buildingLinks(id){const links={core:[['AI','EVA & alignment'],['Missions','Campaign & daily missions'],['Legacy','Legendary brothers']],quarters:[['Commanders','Commander hall'],['Legacy','Brothers of Afterlight']],barracks:[['Commanders','Commanders'],['PvP','Military academy']],lab:[['AI','Neural doctrine']],market:[['Inventory','Inventory & exchange']],hangar:[['World','World operations'],['PvP','Advanced units']],wall:[['PvP','Defense & raids']]};return (links[id]||[]).map(([t,n])=>'<button class="buildingLink" data-act="tab:'+t+'">'+n+'</button>').join('');}
 function buildingOutputText(id){
   if(id==='farm') return `Food production +${(s.l.farm*0.72).toFixed(2)}/sec`;
   if(id==='water') return `Water production +${(s.l.water*0.68).toFixed(2)}/sec`;

   if(id==='wall') return `City defense rating +${s.l.wall*8}`;

 }
 function specialActions(id){
   if(id==='barracks') return `<button data-act="train:guards" ${s.l.barracks<1||!canAfford({food:40,alloy:40})?'disabled':''}>Train 2 Guards · 40 food + 40 alloy</button><br><button data-act="heal" ${s.injured<1||s.l.med<1||!canAfford({water:25})?'disabled':''}>Heal 1 Injured · 25 water</button><br><button data-act="elite" ${s.l.barracks<2||s.training||!canAfford({food:80,alloy:80})?'disabled':''}>Train 2 Elite Guards · 80 food + 80 alloy · 25s</button><p class="small">Elite guards: ${s.elites} · ${s.training?timeLeft(s.training.end):'Training idle'}</p>`;

document.addEventListener('click',e=>{

function resolveMarchOld(){
   const site=sites.find(x=>x.id===s.march.site); if(!site) return;
   s.territory.push(site.id);
   reward(site.reward);
   if(s.commanders.includes(1)) s.res.alloy += 40;
   if(site.id===5){ s.injured += 1; s.message=`${site.name} secured, but your forces took casualties.`; }
   else s.message = `${site.name} secured. Supplies recovered.`;
 }
 function resolveMarch(){const site=sites[s.march.site];if(!site||s.territory.includes(site.id))return;const power=s.march.power??armyPower();const win=power>=site.req;let injured=win&&power<site.req*1.5?Math.min(Math.max(0,s.guards-s.injured),Math.ceil(site.req/30)):0;s.injured+=injured;if(win){s.territory.push(site.id);reward(site.reward);if(s.commanders.includes(1))s.res.alloy+=Math.round((site.reward.alloy||0)*.15);s.campaignWins++;}s.reports.push({name:site.name,power,enemy:site.req,win,injured});s.reports=s.reports.slice(-30);s.message=win?site.name+' secured. Battle report available.':'March defeated. Forces returned.';}

const sessionKey='afterlight_player_session';
function readPlayerSession(){
 try{
  const saved=JSON.parse(localStorage.getItem(sessionKey));
  if(saved?.project===cloudConfig().url&&saved.session?.user?.id&&saved.session.access_token&&saved.session.refresh_token)return saved.session;
 }catch{}
 return null;
}
let cloudSession=readPlayerSession(),refreshPending=null;
function setPlayerSession(session){
 cloudSession=session;
 try{
  if(session)localStorage.setItem(sessionKey,JSON.stringify({project:cloudConfig().url,session}));
  else localStorage.removeItem(sessionKey);
 }catch{}
}
function refreshPlayerSession(){
 const current=cloudSession;
 if(!current)return Promise.reject(Error('Sign in first.'));
 if(current.expires_at*1000>Date.now()+60000)return Promise.resolve();
 if(refreshPending?.session===current)return refreshPending.promise;
 const promise=cloudRequest('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:current.refresh_token}).then(next=>{
  if(cloudSession!==current)throw Error('Player account changed.');
  if(!next?.access_token||!next.refresh_token||next.user?.id!==current.user.id)throw Error('Unable to renew player session.');
  setPlayerSession(next);
 }).catch(err=>{
  if(cloudSession===current&&['refresh_token_not_found','refresh_token_already_used','session_not_found','session_expired','user_not_found'].includes(err.code))setPlayerSession(null);
  throw err;
 }).finally(()=>{if(refreshPending?.session===current)refreshPending=null;});
 refreshPending={session:current,promise};
 return promise;
}

function supplyStage(run,base,now=Date.now()){
 const site=run.afterlight_exploration_sites;
 const start=Date.parse(run.started_at),end=Date.parse(run.ready_at);
 const leg=Math.min((end-start)/2,Math.max(1000,2000*(Math.abs(site.x-base.x)+Math.abs(site.y-base.y))));
 if(now>=end)return {name:'At HQ',position:0,remaining:0};
 if(now<start+leg)return {name:'Outbound',position:Math.max(0,(now-start)/leg),remaining:start+leg-now};
 if(now<end-leg)return {name:'Loading',position:1,remaining:end-leg-now};
 return {name:'Returning',position:(end-now)/leg,remaining:end-now};
}

function updateSupplyDisplay(){
 if(document.hidden||tab!=='Shared'||!cloudSession||shared.busy)return;
 const user=cloudSession.user.id,now=Date.now();
 if(dispatchAccount!==user){
  if(now>=dispatchRetryAt){dispatchRetryAt=now+15000;document.querySelector('[data-shared="refresh"]')?.click();}
  return;
 }
 let ready=null;
 for(const m of shared.gathering||[]){
  const site=m.afterlight_exploration_sites;
  if(!shared.own||!site)continue;
  const stage=supplyStage(m,shared.own,now);
  const card=document.querySelector('[data-convoy="'+Number(m.slot)+'"]');
  if(card){
   card.style.setProperty('--position',(stage.position*100)+'%');
   card.dataset.phase=stage.name;
   card.querySelector('output').textContent=stage.name+(stage.remaining?' · '+durationText(Math.ceil(stage.remaining/1000)):' · unloading cargo');
  }
  const pin=document.querySelector('[data-convoy-pin="'+Number(m.slot)+'"]');
  if(pin){
   const x=shared.own.x+(site.x-shared.own.x)*stage.position-shared.x;
   const y=shared.own.y+(site.y-shared.own.y)*stage.position-shared.y;
   pin.hidden=Math.abs(x)>16||Math.abs(y)>16;
   pin.style.left=(50+x*100/32)+'%';pin.style.top=(50+y*100/32)+'%';
   pin.textContent='▰ S'+Number(m.slot)+' · '+stage.name;
  }
  if(stage.name==='At HQ')ready=m;
 }
 if(ready&&now>=dispatchRetryAt){
  dispatchRetryAt=now+10000;
  const button=[...document.querySelectorAll('#mapOperations [data-shared]')].find(b=>b.dataset.shared==='gatherclaim:'+ready.id);
  if(button)button.click();
 }
}

async function cloudRequest(path,method='GET',body,auth=false,extra={}){const c=cloudConfig();if(!c)throw Error('Configure your Supabase project first.');if(auth)await refreshPlayerSession();const headers={'apikey':c.key,'Content-Type':'application/json',...extra};if(auth)headers.Authorization='Bearer '+cloudSession.access_token;const r=await fetch(c.url+path,{method,headers,...(body===undefined?{}:{body:JSON.stringify(body)})});let data;const raw=await r.text();try{data=JSON.parse(raw)}catch{data=null}if(!r.ok){const err=Error(data?.msg||data?.message||data?.error_description||'Request failed: '+r.status);err.code=data?.error_code||data?.code;throw err;}return data;}

fully.');}else if(a==='load'){if(!cloudSession)throw Error('Sign in first.');const rows=await cloudRequest('/rest/v1/civilization_saves?select=state,updated_at&user_id=eq.'+encodeURIComponent(cloudSession.user.id),'GET',undefined,true);const snapshot=rows?.[0]?.state;if(!snapshot?.l||!snapshot?.res||!Array.isArray(snapshot.commanders))throw Error('No compatible backup found.');restoreCivilization(JSON.stringify(snapshot),'Restore cloud backup from '+rows[0].updated_at+'? Your current local save will be replaced.');}else if(a==='export'){tick();const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download='afterlight-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);cloudStatus('Local backup export started.');}}catch(err){cloudStatus(err.message||'Request failed.');}finally{cloudBusy=false;b.disabled=false;}});

<script>
(() => {
  const button=document.getElementById('audioToggle');
  let ctx, master, timer, enabled=false, step=0;
  const notes=[55,55,65.406,65.406,49,49,43.654,43.654];
  const chords=[[1,1.5,2.3784],[1,1.5,2.3784],[1,1.2599,1.5],[1,1.2599,1.5],[1,1.4983,2],[1,1.4983,2],[1,1.4983,2.5198],[1,1.4983,2.5198]];
  function tone(hz,at,duration,level,type='sine',attack=.045){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=hz;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(level,at+Math.min(attack,duration*.4));
    g.gain.exponentialRampToValueAtTime(0.0001,at+duration);
    o.connect(g);g.connect(master);o.start(at);o.stop(at+duration+0.02);
    o.onended=()=>{o.disconnect();g.disconnect();};
  }
  function pulse(){
    if(!enabled||ctx.state!=='running'||document.hidden)return;
    const at=ctx.currentTime+0.04,i=step++%notes.length,n=notes[i];
    tone(n,at,2.8,0.045,'sine',.7);
    tone(n*2,at,2.9,0.016,'triangle',.8);
    if(i%2===0){for(const ratio of chords[i])tone(n*ratio*2,at,4.4,0.012,'sine',1.2);}
    if(i%4===1){tone(n*3,at+.35,1.8,.009,'sine',.4);tone(n*4,at+1.05,1.2,.006,'sine',.3);}
  }
  function stop(){
    enabled=false;clearInterval(timer);timer=null;
    if(ctx&&master)master.gain.setTargetAtTime(0,ctx.currentTime,0.035);
    button.textContent='♪ Off';button.setAttribute('aria-pressed','false');
  }
  button.addEventListener('click',async()=>{
    if(enabled){stop();return;}
    button.disabled=true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)throw Error('Audio unavailable');
      if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);}
      await ctx.resume();
      if(document.hidden)return;
      enabled=true;master.gain.setTargetAtTime(0.65,ctx.currentTime,0.04);
      button.textContent='♪ On';button.setAttribute('aria-pressed','true');
      pulse();timer=setInterval(pulse,2200);
    }catch(e){stop();button.title='Audio unavailable on this device';}
    finally{button.disabled=false;}
  });
  document.addEventListener('click',e=>{
    if(!enabled||!ctx||ctx.state!=='running'||document.hidden)return;
    const target=e.target.closest('[data-act]');
    if(target&&!target.disabled){const a=ctx.currentTime;const action=target.dataset.act||'';if(action.startsWith('upgrade:')||action.startsWith('recruit:')){tone(330,a,.13,.025,'triangle');tone(495,a+.1,.2,.018,'sine');}else{tone(action.startsWith('tab:')?220:280,a,.09,.018,'triangle');}}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&enabled)stop();});
})();
</script>
