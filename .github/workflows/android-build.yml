name: Afterlight Android build
on:
  workflow_dispatch:
    inputs:
      sign_bundle:
        description: Sign the Play bundle with the configured upload key
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'genesis-art/**'
      - 'support/**'
      - 'city3d.js'
      - 'world3d.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
concurrency:
  group: afterlight-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run android:prepare
      - name: Configure Android release
        run: python3 scripts/configure-android.py
      - run: bash gradlew assembleDebug bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: afterlight-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Sign Play bundle
        if: github.event_name == 'workflow_dispatch' && inputs.sign_bundle && github.ref == 'refs/heads/main'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          : "${UPLOAD_KEYSTORE:?Missing upload keystore}" "${STORE_PASS:?Missing store password}" "${KEY_PASS:?Missing key password}" "${KEY_ALIAS:?Missing alias}"
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode > "$keyfile"
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$keyfile" -storepass:env STORE_PASS -keypass:env KEY_PASS "$bundle" "$KEY_ALIAS"
          jarsigner -verify "$bundle"
          unzip -Z1 "$bundle" | grep -Ei '^META-INF/[^/]+\.(RSA|EC|DSA)$'
      - uses: actions/upload-artifact@v4
        with:
          name: afterlight-play-${{ github.event_name == 'workflow_dispatch' && inputs.sign_bundle && github.ref == 'refs/heads/main' && 'signed' || 'unsigned' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
