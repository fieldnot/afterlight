name: Afterlight iOS unsigned build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'city3d.js'
      - 'world3d.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: afterlight-ios
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run ios:prepare
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build/ios build
      - uses: actions/upload-artifact@v4
        with:
          name: afterlight-ios-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
