name: Afterlight iOS build and TestFlight
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed release to App Store Connect for TestFlight
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'genesis-art/**'
      - 'support/**'
      - 'city3d.js'
      - 'world3d.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'ios-release/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: afterlight-ios
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Select an installed Xcode 26 or newer
        run: |
          app=$(python3 - <<'PY'
          import glob, plistlib, re
          from pathlib import Path
          choices = []
          for path in glob.glob('/Applications/Xcode*.app'):
              with open(Path(path) / 'Contents' / 'Info.plist', 'rb') as f:
                  version = plistlib.load(f)['CFBundleShortVersionString']
              if re.fullmatch(r'\d+(\.\d+)*', version) and 'beta' not in path.lower():
                  parts = tuple(map(int, version.split('.')))
                  if parts[0] >= 26:
                      choices.append((parts, path))
          print(max(choices)[1])
          PY
          )
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
      - run: npm run ios:prepare
      - run: bash ios-release/prepare.sh
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build/ios build
      - uses: actions/upload-artifact@v4
        with:
          name: afterlight-ios-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
      - name: Check release signing setup
        env:
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY != '' }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            flag="HAS_${name}"
            if [[ "${!flag}" != true ]]; then echo "::notice::Missing release setting: $name"; fi
          done
      - name: Archive for iPhone
        env:
          UPLOAD_TESTFLIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight && github.ref == 'refs/heads/main' }}
          APPLE_TEAM_ID: ${{ inputs.upload_testflight && github.ref == 'refs/heads/main' && secrets.APPLE_TEAM_ID || '' }}
          ASC_KEY_ID: ${{ inputs.upload_testflight && github.ref == 'refs/heads/main' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ inputs.upload_testflight && github.ref == 'refs/heads/main' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ inputs.upload_testflight && github.ref == 'refs/heads/main' && secrets.ASC_PRIVATE_KEY || '' }}
        run: bash ios-release/archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: afterlight-iphone-release
          path: build/Afterlight-device.zip
          if-no-files-found: error
          retention-days: 30
